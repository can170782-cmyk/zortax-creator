
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZORTAX Creator</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#090b13;color:white;font-family:Arial;display:flex;align-items:center;justify-content:center;padding:18px}
.container{width:100%;max-width:480px;background:#141827;border:1px solid #292f43;border-radius:22px;padding:25px 20px;box-shadow:0 15px 50px #0008}
.logo{text-align:center;font-size:36px;font-weight:900;letter-spacing:3px;color:#8b7cff}
.sub{text-align:center;color:#aab0c5;margin:10px 0 28px}
h3{font-size:16px;margin:18px 0 10px}
input[type=file]{width:100%;padding:14px;border:1px dashed #7565ff;border-radius:12px;background:#0c1020;color:white}
button{width:100%;padding:16px;margin-top:20px;border:0;border-radius:12px;background:linear-gradient(135deg,#7565ff,#a34dff);color:white;font-size:17px;font-weight:bold}
button:disabled{opacity:.5}
#result{margin-top:18px;padding:14px;background:#0c1020;border-radius:10px;text-align:center;overflow-wrap:anywhere;line-height:1.5}
.info{text-align:center;color:#929ab2;font-size:12px;margin-top:20px}
</style>
</head>
<body>
<div class="container">
<div class="logo">ZORTAX</div>
<div class="sub">CREATOR · Video hazırlama motoru</div>

<h3>Telefonundan video seç</h3>
<input type="file" id="video" accept="video/mp4,video/quicktime,video/webm,video/x-matroska">

<button id="btn" onclick="prepareVideo()">VİDEOYU HAZIRLA</button>

<div id="result">ZORTAX motoru hazır.</div>
<div class="info">Dikey 9:16 · Bulanık arka plan · MP4 çıktı</div>
</div>

<script>
async function prepareVideo(){
const file=document.getElementById("video").files[0];
const btn=document.getElementById("btn");
const result=document.getElementById("result");

if(!file){
result.textContent="Önce telefonundan bir video seç.";
return;
}

if(file.size>300*1024*1024){
result.textContent="Video 300 MB sınırını geçiyor.";
return;
}

const form=new FormData();
form.append("video",file);

btn.disabled=true;
result.textContent="⏳ Video yükleniyor ve hazırlanıyor. Lütfen bekle...";

try{
const response=await fetch("https://zortax-creator.onrender.com/process",{
method:"POST",
body:form
});

if(!response.ok){
let message="Video hazırlanamadı.";
try{
const error=await response.json();
message=error.error||message;
}catch(e){}
throw new Error(message);
}

const blob=await response.blob();
if(!blob.size)throw new Error("Video dosyası boş geldi.");

const downloadUrl=URL.createObjectURL(blob);
const link=document.createElement("a");
link.href=downloadUrl;
link.download="ZORTAX_FINAL.mp4";
document.body.appendChild(link);
link.click();
link.remove();

result.textContent="✅ Video hazır! İndirme başladı.";
setTimeout(()=>URL.revokeObjectURL(downloadUrl),60000);

}catch(error){
result.textContent="❌ Hata: "+error.message;
}finally{
btn.disabled=false;
}
}
</script>
</body>
</html>
